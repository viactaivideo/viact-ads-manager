[project]
name = "viact-ads-manager"
version = "0.1.0"
description = "Direct Google Ads API (MCC) integration exposed to Claude over MCP"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
viact-ads-mcp = "viact_ads.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/viact_ads"]
